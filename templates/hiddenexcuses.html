<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>hidden excuses</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <script src="https://kit.fontawesome.com/3cfd2ec1aa.js" crossorigin="anonymous"></script>
    </head>
    <body class="bg-[#f4f4f0] text-black min-h-screen py-10 px-4 sm:px-8 selection:bg-pink-400">
        <div class="max-w-7xl mx-auto">
            <div
                class="flex flex-col md:flex-row md:items-center md:justify-between gap-6 mb-10">
                <div>
                    <h1 class="text-5xl font-extrabold tracking-[-0.05em]">
                        hidden excuses.
                    </h1>

                    <p class="text-gray-500 mt-2">
                        excuses which were reported by users
                    </p>
                </div>

                <div class="flex flex-wrap gap-4">
                    <button onclick="history.back()" class="border-[3px] border-[#1a1a1a] px-5 py-3 font-bold shadow-[6px_6px_0px_#1a1a1a] transition-all duration-200 hover:border-[#ee7e0f] hover:text-[#ee7e0f] hover:shadow-[8px_8px_0px_#ee7e0f] cursor-pointer">
                        go back
                    </button>

                    <a href="/admin" class="inline-block border-[3px] border-[#1a1a1a] px-5 py-3 font-bold shadow-[6px_6px_0px_#1a1a1a] transition-all duration-200 hover:border-[#ee7e0f] hover:text-[#ee7e0f] hover:shadow-[8px_8px_0px_#ee7e0f]">
                        manage all excuses
                    </a>
                </div>
            </div>

            <div class="border-[3px] border-[#1a1a1a] bg-[#faf9f6] shadow-[8px_8px_0px_#1a1a1a] overflow-x-auto">
                <table class="w-full min-w-[1000px]">
                    <thead>
                        <tr class="border-b-[3px] border-[#1a1a1a] bg-[#ee7e0f] text-[#faf9f6]">
                            <th class="px-6 py-4 text-left font-bold">#</th>
                            <th class="px-6 py-4 text-left font-bold">Name</th>
                            <th class="px-6 py-4 text-left font-bold">Excuse</th>
                            <th class="px-6 py-4 text-left font-bold">Points</th>
                            <th class="px-6 py-4 text-left font-bold">Reason</th>
                        </tr>
                    </thead>

                    <tbody>
                        {% for position, excuse in ranked %}
                        <tr class="border-b border-black">
                            <td class="px-6 py-5 font-bold">{{ position }}</td>
                            <td class="px-6 py-5">{{ excuse.name }}</td>
                            <td class="px-6 py-5">{{ excuse.excuse }}</td>
                            <td class="px-6 py-5 font-bold">{{ excuse.points }}</td>
                            <td class="px-6 py-5">{{ excuse.reason }}</td>
                        </tr>

                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </body>
</html>
